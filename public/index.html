<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM - إدارة الطلبيات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">

  <div class="max-w-7xl mx-auto p-4 md:p-8">

    <div class="bg-white rounded-xl shadow p-5 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">لوحة إدارة الطلبيات</h1>
        <p class="text-gray-500 text-sm">CRM لتأكيد ومتابعة طلبات المتجر</p>
      </div>

      <div class="flex gap-2">
        <a href="/api/export-csv"
           class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">
          تصدير المؤكد Excel
        </a>

        <button onclick="loadOrders()"
                class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold">
          تحديث
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-gray-500">كل الطلبات</p>
        <p id="total" class="text-3xl font-bold">0</p>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-green-600">مؤكد</p>
        <p id="confirmed" class="text-3xl font-bold text-green-600">0</p>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-yellow-600">قيد المتابعة</p>
        <p id="pending" class="text-3xl font-bold text-yellow-600">0</p>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-red-600">ملغى</p>
        <p id="cancelled" class="text-3xl font-bold text-red-600">0</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-right">
        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="p-3">#</th>
            <th class="p-3">الزبون</th>
            <th class="p-3">الهاتف</th>
            <th class="p-3">العنوان</th>
            <th class="p-3">السعر</th>
            <th class="p-3">الحالة</th>
            <th class="p-3">إجراء</th>
          </tr>
        </thead>

        <tbody id="ordersTable"></tbody>
      </table>
    </div>

  </div>

  <script>
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadOrders() {
      const response = await fetch('/api/orders');
      const orders = await response.json();

      let confirmed = 0;
      let cancelled = 0;
      let pending = 0;

      const table = document.getElementById('ordersTable');
      table.innerHTML = '';

      orders.forEach(order => {
        if (order.status === 'مؤكد') confirmed++;
        else if (order.status === 'ملغى') cancelled++;
        else pending++;

        table.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3 font-bold">#${order.id}</td>
            <td class="p-3">${escapeHtml(order.name)}</td>
            <td class="p-3">
              <a class="text-blue-600 font-bold" href="tel:${escapeHtml(order.phone)}">
                📞 ${escapeHtml(order.phone)}
              </a>
            </td>
            <td class="p-3">${escapeHtml(order.wilaya)} - ${escapeHtml(order.commune)}</td>
            <td class="p-3 text-green-600 font-bold">${order.price} د.ج</td>
            <td class="p-3">
              <select id="status-${order.id}" class="border rounded p-2 text-sm">
                <option value="جديد" ${order.status === 'جديد' ? 'selected' : ''}>جديد</option>
                <option value="مؤكد" ${order.status === 'مؤكد' ? 'selected' : ''}>مؤكد ✅</option>
                <option value="لا يجيب 1" ${order.status === 'لا يجيب 1' ? 'selected' : ''}>لا يجيب 1</option>
                <option value="لا يجيب 2" ${order.status === 'لا يجيب 2' ? 'selected' : ''}>لا يجيب 2</option>
                <option value="مؤجل" ${order.status === 'مؤجل' ? 'selected' : ''}>مؤجل</option>
                <option value="ملغى" ${order.status === 'ملغى' ? 'selected' : ''}>ملغى ❌</option>
              </select>
            </td>
            <td class="p-3">
              <button onclick="saveOrder(${order.id})"
                class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-bold">
                حفظ
              </button>
            </td>
          </tr>
        `;
      });

      document.getElementById('total').innerText = orders.length;
      document.getElementById('confirmed').innerText = confirmed;
      document.getElementById('pending').innerText = pending;
      document.getElementById('cancelled').innerText = cancelled;
    }

    async function saveOrder(id) {
      const status = document.getElementById(`status-${id}`).value;

      await fetch(`/api/orders/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          status: status,
          notes: ''
        })
      });

      loadOrders();
    }

    loadOrders();
  </script>

</body>
</html>
