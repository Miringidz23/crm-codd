<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD CRM - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', sans-serif; }
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .glow-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 0 30px rgba(59,130,246,0.3);
      transition: all 0.3s;
    }
    .glow-btn:hover {
      box-shadow: 0 0 50px rgba(59,130,246,0.5);
      transform: translateY(-2px);
    }
    .floating { animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8 floating">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 mb-4 shadow-2xl">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-white">COD CRM</h1>
      <p class="text-gray-400 mt-2">نظام إدارة الطلبيات - الجزائر 🇩🇿</p>
    </div>

    <!-- Login Form -->
    <div class="glass-card rounded-2xl p-8">
      <form id="loginForm" class="space-y-6">
        <div>
          <label class="block text-gray-300 text-sm font-medium mb-2">اسم المستخدم</label>
          <input type="text" id="username" required
                 class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white 
                        placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500
                        focus:border-transparent transition-all"
                 placeholder="أدخل اسم المستخدم">
        </div>

        <div>
          <label class="block text-gray-300 text-sm font-medium mb-2">كلمة المرور</label>
          <input type="password" id="password" required
                 class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white 
                        placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500
                        focus:border-transparent transition-all"
                 placeholder="أدخل كلمة المرور">
        </div>

        <div id="errorMsg" class="hidden bg-red-500/20 border border-red-500/50 rounded-xl p-3 text-red-300 text-sm"></div>

        <button type="submit" class="w-full glow-btn text-white font-bold py-3 px-6 rounded-xl text-lg">
          تسجيل الدخول
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-xs">الحساب الافتراضي: admin / admin123</p>
      </div>
    </div>
  </div>

  <script>
    // تحقق إذا كان المستخدم مسجل دخول
    if (localStorage.getItem('token')) {
      window.location.href = '/crm';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/crm';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
