<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية (CRM Enterprise)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #shippingLabel, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 10px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- تسجيل الدخول -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 no-print">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <span class="text-4xl">🔐</span>
            <h2 class="text-xl font-bold text-gray-800 mt-2 text-center">دخول الـ CRM</h2>
            <input type="password" id="loginPass" placeholder="كلمة السر..." class="w-full p-3 border rounded-xl my-4 text-center font-bold outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="login()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700">دخول</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="mainContent" class="hidden max-w-7xl mx-auto p-4 md:p-8 no-print">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-gray-800">نظام إدارة المبيعات والتأكيد</h1>
                    <span id="roleBadge" class="text-xs font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-800">أدمن</span>
                </div>
                <p class="text-sm text-gray-500">إدارة الطلبيات، طباعة الوصل، والتحليلات</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <!-- الزر الجديد هنا -->
                <button onclick="toggleModal('manualOrderModal')" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-lg text-sm">➕ إضافة يدوية</button>
                <button id="btnSettings" onclick="toggleModal('settingsModal')" class="hidden bg-gray-800 text-white font-bold px-4 py-2 rounded-lg text-sm">⚙️ الإعدادات</button>
                <a href="/api/export-csv" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm">📥 Excel</a>
                <button onclick="loadCRM()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold">🔄 تحديث</button>
            </div>
        </div>

        <!-- الإحصائيات -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6 text-center">
            <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-blue-500">
                <div class="text-xs text-gray-500">الطلبيات</div>
                <div id="statTotal" class="text-xl font-bold">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-green-500">
                <div class="text-xs text-gray-500">المؤكدة</div>
                <div id="statConfirmed" class="text-xl font-bold text-green-600">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-yellow-500">
                <div class="text-xs text-gray-500">مؤجل</div>
                <div id="statPending" class="text-xl font-bold text-yellow-600">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-r-4 border-red-500">
                <div class="text-xs text-gray-500">الملغاة</div>
                <div id="statCancelled" class="text-xl font-bold text-red-600">0</div>
            </div>
            <div id="profitCard" class="hidden col-span-2 md:col-span-1 bg-emerald-50 p-4 rounded-xl border-r-4 border-emerald-600">
                <div class="text-xs font-bold text-emerald-800">💵 الأرباح</div>
                <div id="statNetProfit" class="text-xl font-bold text-emerald-700">0 د.ج</div>
            </div>
        </div>

        <!-- البحث -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex gap-3">
            <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="🔍 ابحث بالاسم أو الهاتف..." class="w-full p-2.5 border rounded-lg text-sm outline-none">
            <select id="statusFilter" onchange="filterOrders()" class="w-48 p-2.5 border rounded-lg text-sm font-bold bg-gray-50">
                <option value="ALL">جميع الحالات</option>
                <option value="جديد">جديد</option>
                <option value="مؤكد">مؤكد ✅</option>
                <option value="ملغى">ملغى ❌</option>
            </select>
        </div>

        <!-- الجدول -->
        <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-xs">
                    <tr>
                        <th class="p-4">#</th>
                        <th class="p-4">الزبون</th>
                        <th class="p-4">تواصل</th>
                        <th class="p-4">العنوان</th>
                        <th class="p-4">الحالة</th>
                        <th class="p-4">الوصل</th>
                    </tr>
                </thead>
                <tbody id="ordersTable" class="divide-y text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الإضافة اليدوية -->
    <div id="manualOrderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4">➕ إضافة طلبية يدوية</h2>
            <form id="manualOrderForm" class="space-y-3">
                <input type="text" id="mName" placeholder="اسم الزبون" class="w-full p-2 border rounded" required>
                <input type="text" id="mPhone" placeholder="رقم الهاتف" class="w-full p-2 border rounded" required>
                <input type="text" id="mWilaya" placeholder="الولاية" class="w-full p-2 border rounded" required>
                <input type="text" id="mProduct" placeholder="اسم المنتج" class="w-full p-2 border rounded" required>
                <input type="number" id="mPrice" placeholder="السعر (دج)" class="w-full p-2 border rounded" required>
                <select id="mStatus" class="w-full p-2 border rounded">
                    <option value="جديد">جديد</option>
                    <option value="مؤكد">مؤكد</option>
                </select>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold">حفظ</button>
                    <button type="button" onclick="toggleModal('manualOrderModal')" class="flex-1 bg-gray-200 py-2 rounded">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة وصل التوصيل -->
    <div id="labelModal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-lg w-full">
            <div id="printableArea" class="border-4 border-black p-5 bg-white text-black rounded-none">
                <div class="flex justify-between border-b-2 border-black pb-2 mb-2">
                    <h2 id="lblStoreName" class="font-black text-xl">STORE</h2>
                    <span id="lblOrderId" class="font-black border-2 border-black px-2">#000</span>
                </div>
                <div class="border-2 border-black p-2 mb-2">
                    <div id="lblCustomerName" class="font-black text-lg">---</div>
                    <div id="lblCustomerPhone" class="font-black text-xl my-1">---</div>
                    <div id="lblCustomerAddress" class="font-bold text-md text-gray-800">---</div>
                </div>
                <div class="border-4 border-black p-2 text-center bg-black text-white">
                    <div class="text-xs font-bold uppercase">المبلغ المطلوب تحصيله:</div>
                    <div id="lblTotalPrice" class="text-3xl font-black my-1">0 د.ج</div>
                </div>
            </div>
            <button onclick="window.print()" class="w-full bg-emerald-600 text-white font-black py-3 mt-4 rounded-xl">🖨️ طباعة الآن</button>
            <button onclick="toggleModal('labelModal')" class="w-full bg-gray-200 py-2 mt-2 rounded-xl text-sm font-bold">إغاء</button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full max-h-[80vh] overflow-auto">
            <h2 class="text-xl font-bold mb-4">⚙️ إعدادات المتجر</h2>
            <form id="settingsForm" class="space-y-2 text-xs">
                <input type="text" id="setProductName" placeholder="اسم المنتج" class="w-full p-2 border rounded">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="setPrice" placeholder="سعر البيع" class="w-full p-2 border rounded">
                    <input type="number" id="setBuyPrice" placeholder="سعر الشراء" class="w-full p-2 border rounded">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="setShippingCost" placeholder="التوصيل" class="w-full p-2 border rounded">
                    <input type="number" id="setAdCost" placeholder="الإعلان" class="w-full p-2 border rounded">
                </div>
                <input type="text" id="setAdminPass" placeholder="كلمة سر الأدمن" class="w-full p-2 border rounded">
                <input type="text" id="setAgentPass" placeholder="كلمة سر العامل" class="w-full p-2 border rounded">
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded">حفظ التغييرات</button>
            </form>
        </div>
    </div>

    <script>
        let globalSettings = {};
        let currentRole = 'agent';
        let allOrders = [];

        async function login() {
            const pass = document.getElementById('loginPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pass})
            });
            const data = await res.json();
            if(res.ok) {
                currentRole = data.role;
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                if(currentRole === 'admin') {
                    document.getElementById('profitCard').classList.remove('hidden');
                    document.getElementById('btnSettings').classList.remove('hidden');
                    document.getElementById('roleBadge').innerText = 'أدمن (مول البيزنس)';
                }
                loadCRM();
            } else { alert('كلمة السر خاطئة!'); }
        }

        async function loadCRM() {
            const setRes = await fetch('/api/settings');
            globalSettings = await setRes.json();
            const res = await fetch('/api/orders');
            allOrders = await res.json();
            renderTable(allOrders);
        }

        function renderTable(orders) {
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = '';
            let confirmed = 0, pending = 0, cancelled = 0;

            orders.forEach(o => {
                if (o.status === 'مؤكد') confirmed++;
                else if (o.status === 'ملغى') cancelled++;
                else pending++;

                let cleanPhone = o.phone.replace(/[^0-9]/g, '');
                if(cleanPhone.startsWith('0')) cleanPhone = '213' + cleanPhone.substring(1);
                
                tbody.innerHTML += `
                    <tr>
                        <td class="p-4 font-bold">#${o.id}</td>
                        <td class="p-4">${o.name}</td>
                        <td class="p-4 flex gap-1">
                            <a href="tel:${o.phone}" class="bg-blue-100 text-blue-700 p-1 rounded text-xs">📞</a>
                            <a href="https://wa.me/${cleanPhone}" class="bg-green-100 text-green-700 p-1 rounded text-xs">💬</a>
                        </td>
                        <td class="p-4 text-xs">${o.wilaya}</td>
                        <td class="p-4">
                            <select onchange="updateOrder(${o.id}, this.value, '${o.notes || ''}')" class="text-xs p-1 rounded border">
                                <option value="جديد" ${o.status === 'جديد' ? 'selected' : ''}>جديد</option>
                                <option value="مؤكد" ${o.status === 'مؤكد' ? 'selected' : ''}>مؤكد ✅</option>
                                <option value="ملغى" ${o.status === 'ملغى' ? 'selected' : ''}>ملغى ❌</option>
                            </select>
                        </td>
                        <td class="p-4"><button onclick="openShippingLabel(${o.id})" class="text-xs font-bold">🖨️ وصل</button></td>
                    </tr>
                `;
            });
            document.getElementById('statTotal').innerText = allOrders.length;
            document.getElementById('statConfirmed').innerText = confirmed;
            document.getElementById('statNetProfit').innerText = (confirmed * (globalSettings.price - globalSettings.buy_price - 1000)).toLocaleString() + ' دج';
        }

        function openShippingLabel(id) {
            const o = allOrders.find(x => x.id === id);
            document.getElementById('lblCustomerName').innerText = o.name;
            document.getElementById('lblCustomerPhone').innerText = o.phone;
            document.getElementById('lblCustomerAddress').innerText = o.wilaya;
            document.getElementById('lblTotalPrice').innerText = Number(o.price).toLocaleString() + ' دج';
            toggleModal('labelModal');
        }

        async function updateOrder(id, status, notes) {
            await fetch(`/api/orders/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status, notes}) });
            loadCRM();
        }

        document.getElementById('manualOrderForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('mName').value,
                phone: document.getElementById('mPhone').value,
                wilaya: document.getElementById('mWilaya').value,
                commune: 'يدوي',
                product: document.getElementById('mProduct').value,
                price: document.getElementById('mPrice').value,
                status: document.getElementById('mStatus').value
            };
            await fetch('/api/orders', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            toggleModal('manualOrderModal');
            loadCRM();
        };

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }
        function filterOrders() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const s = document.getElementById('statusFilter').value;
            renderTable(allOrders.filter(o => (o.name.toLowerCase().includes(q) || o.phone.includes(q)) && (s === 'ALL' || o.status === s)));
        }
    </script>
</body>
    </html>
